<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dizzyits</title>
<meta name="description" content="Dizzyits - all my links in one place.">
<style>
  /* Change these two lines to recolor the whole page */
  :root{ --page:#c2410c; --card:#ffffff30; --text:#fff; }
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;background:var(--page);color:var(--text);
    font:600 16px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:48px 18px 28px}
  main{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center}
  .avatar{width:96px;height:96px;border-radius:50%;background:#111 center/cover;display:grid;place-items:center;
    font:900 3rem/1 Impact,sans-serif;color:#ff6a1a;overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  h1{font-size:1.5rem;font-weight:800;margin-top:16px}
  .bio{margin:6px 0 28px;font-size:1rem;text-align:center}
  .list{width:100%;display:flex;flex-direction:column;gap:14px}
  .link{display:flex;align-items:center;min-height:56px;padding:0 12px;border-radius:14px;background:var(--card);
    color:var(--text);text-decoration:none;transition:transform .12s,background .12s}
  .link:hover{transform:scale(1.02);background:#ffffff48}
  .icon{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center}
  .icon svg{width:22px;height:22px}
  .label{flex:1;text-align:center;padding:0 34px 0 0}
  .label small{display:block;font-weight:500;font-size:.75rem;opacity:.8}
  footer{margin-top:44px;font-size:.78rem;font-weight:500;opacity:.85}
  .block{width:100%;margin-top:34px}
  .ad-slot{min-height:90px;background:#ffffff18;border-radius:14px;padding:8px;overflow:hidden}
  .ad-slot small{display:block;font-size:.68rem;font-weight:500;opacity:.8;text-align:center;margin-bottom:4px}
  .block h2{font-size:1.1rem;font-weight:800;text-align:center;margin-bottom:14px;text-transform:uppercase;letter-spacing:.08em}
  .vid{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:14px}
  .vid .ratio{position:relative;aspect-ratio:16/9;background:#000}
  .vid .tt{position:relative;aspect-ratio:9/16;max-height:560px;max-width:340px;margin:0 auto;background:#000}
  .vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .vid p{padding:10px 14px;font-size:.95rem}
  .news{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:14px;font-weight:500}
  .news small{opacity:.8;font-size:.78rem}
  .news h3{font-size:1.1rem;font-weight:800;margin:2px 0 6px}
  .news img{width:100%;border-radius:10px;margin:6px 0;display:block}
  .news .body{display:none;margin-top:10px}
  .news.open .body{display:block}
  .news .body p{margin-bottom:10px}
  .news button{margin-top:8px;background:none;border:0;border-bottom:1px solid #fff;color:#fff;font:700 .85rem system-ui;cursor:pointer;padding:0}
  /* Colors matched to the profile picture: sky blue sunburst, white, black outlines, orange */
  :root{--ink:#111;--blue:#3b82f0;--blue2:#4b97f5;--orange:#ff8a1f}
  body{background:repeating-conic-gradient(from 0deg at 50% 25%,var(--blue2) 0 6deg,var(--blue) 6deg 12deg) fixed;color:#fff}
  h1,.bio,.block h2{text-shadow:2px 2px 0 #000}
  .avatar{border:4px solid #000;box-shadow:4px 4px 0 #000}
  .link,.vid,.news,.ad-slot{background:#fff;color:var(--ink);border:3px solid #000;box-shadow:4px 4px 0 #000}
  .link:hover{background:var(--orange);transform:translate(-2px,-2px);box-shadow:6px 6px 0 #000}
  .news button{color:var(--ink);border-bottom-color:var(--orange)}
  .vid p{color:var(--ink)}
  .ad-slot small{color:#444;opacity:1}
  footer{text-shadow:1px 1px 0 #000;opacity:1;color:#fff}
</style>
</head>
<body>
<main>
  <div class="avatar" id="avatar">D</div>
  <h1>Dizzyits</h1>
  <p class="bio">Streams, videos and good times.</p>

  <div class="list">
    <a class="link" href="https://discord.com/invite/nFR9J3K7vZ" target="_blank" rel="noopener">
      <span class="icon" style="background:#5865f2"><svg viewBox="0 0 24 24" fill="#fff"><path d="M5 6.5C7 5 9 4.5 9 4.5l.5 1.2c.8-.1 1.6-.2 2.5-.2s1.7.1 2.5.2l.5-1.2s2 .5 4 2c1.6 3 2.4 6 2.2 10-1.5 1.2-3 1.8-4.5 2.2l-1-1.7c.5-.2 1-.4 1.4-.7-.9.4-2.3.8-5.1.8s-4.2-.4-5.1-.8c.4.3.9.5 1.4.7l-1 1.700c-1.500-.4-3-1-4.500-2.200C2.600 12.500 3.400 9.500 5 6.500zm4.300 4.800a1.400 1.600 0 1 0 0 3.200 1.400 1.600 0 0 0 0-3.200zm5.400 0a1.400 1.600 0 1 0 0 3.200 1.400 1.600 0 0 0 0-3.200z"/></svg></span>
      <span class="label">Join the Discord<small>Community server &middot; free to join</small></span>
    </a>
    <a class="link" href="https://www.twitch.tv/dizzyits_" target="_blank" rel="noopener">
      <span class="icon" style="background:#9146ff"><svg viewBox="0 0 24 24" fill="#fff"><path d="M4 3h17v11l-5 5h-4l-3 3v-3H4V3zm2 2v12h4v2l2-2h4l3-3V5H6zm4 3h2v5h-2V8zm5 0h2v5h-2V8z"/></svg></span>
      <span class="label">Twitch</span>
    </a>
    <a class="link" href="https://www.youtube.com/@DizzyIts" target="_blank" rel="noopener">
      <span class="icon" style="background:#fff"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4" fill="#ff0000"/><path d="M10 9l5 3-5 3z" fill="#fff"/></svg></span>
      <span class="label">YouTube</span>
    </a>
    <a class="link" href="https://x.com/DizzyIts_" target="_blank" rel="noopener">
      <span class="icon" style="background:#000"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.200" stroke-linecap="round"><path d="M5 4l14 16M19 4L5 20"/></svg></span>
      <span class="label">X / Twitter</span>
    </a>
  </div>

  <div class="block" id="vidBlock"><h2>Latest</h2><div id="vids"></div></div>
  <div class="block" id="newsBlock"><h2>News</h2><div id="news"></div></div>

  <div class="block ad-slot"></div>

  <footer>&copy; <span id="yr"></span> Dizzyits.com</footer>
</main>
<script src="content.js"></script>
<script src="ads.js" defer></script>
<script src="live.js?v=5" defer></script>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const idOk = s => /^[\w-]+$/.test(String(s));
  const fmt = d => { const t = new Date(d + "T12:00:00"); return isNaN(t) ? "" : t.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); };
  $("yr").textContent = new Date().getFullYear();

  // profile picture (avatar.webp sits next to this page)
  const img = new Image();
  img.onload = () => { const a = $("avatar"); a.textContent = ""; img.alt = "Dizzyits"; a.appendChild(img); };
  img.src = "avatar.webp";

  // Videos & news come from content.js (same file as the main site)
  const par = encodeURIComponent(location.hostname || "localhost");
  const vids = POSTS.filter(p => idOk(p.id)).slice(0, 3).map(p => {
    let frame = "";
    if (p.type === "youtube") frame = `<div class="ratio"><iframe src="https://www.youtube-nocookie.com/embed/${p.id}" loading="lazy" allowfullscreen title="${esc(p.title)}"></iframe></div>`;
    else if (p.type === "tiktok") frame = `<div class="tt"><iframe src="https://www.tiktok.com/embed/v2/${p.id}" loading="lazy" allowfullscreen title="${esc(p.title)}"></iframe></div>`;
    else if (p.type === "twitch-clip") frame = `<div class="ratio"><iframe src="https://clips.twitch.tv/embed?clip=${p.id}&parent=${par}" loading="lazy" allowfullscreen title="${esc(p.title)}"></iframe></div>`;
    return frame ? `<div class="vid">${frame}<p>${esc(p.title)}</p></div>` : "";
  }).join("");
  if (vids) $("vids").innerHTML = vids; else $("vidBlock").remove();

  if (NEWS.length) {
    $("news").innerHTML = NEWS.map((n,i) => {
      const hasImg = n.image && /^https?:\/\//.test(n.image);
      const paras = String(n.body || "").split(/\n\s*\n/).map(t => `<p>${esc(t)}</p>`).join("");
      return `<article class="news" id="n${i}"><small>${fmt(n.date)}</small><h3>${esc(n.title)}</h3>
        ${hasImg ? `<img src="${esc(n.image)}" alt="" loading="lazy">` : ""}
        <div>${esc(n.summary)}</div>
        ${n.body ? `<div class="body">${paras}</div><button data-i="${i}">Read more</button>` : ""}</article>`;
    }).join("");
  } else $("newsBlock").remove();

  document.addEventListener("click", e => {
    const b = e.target.closest(".news button"); if (!b) return;
    const a = $("n" + b.dataset.i); a.classList.toggle("open");
    b.textContent = a.classList.contains("open") ? "Show less" : "Read more";
  });
</script>
</body>
</html>
