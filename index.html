<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const idOk = s => /^[\w-]+$/.test(String(s));
  const fmt = d => { const t = new Date(d + "T12:00:00"); return isNaN(t) ? "" : t.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); };
  $("yr").textContent = new Date().getFullYear();

  // profile picture (avatar.webp sits next to this page)
  const img = new Image();
  img.onload = () => { const a = $("avatar"); a.textContent = ""; img.alt = "Dizzyits"; a.appendChild(img); };
  img.src = "avatar.webp";

  // Videos & news come from content.js (same file as the main site)
  const par = encodeURIComponent(location.hostname || "localhost");
  const vids = POSTS.filter(p => idOk(p.id)).slice(0, 3).map(p => {
    let frame = "";
    if (p.type === "youtube") frame = `<div class="ratio"><iframe src="https://www.youtube-nocookie.com/embed/${p.id}" loading="lazy" allowfullscreen title="${esc(p.title)}"></iframe></div>`;
    else if (p.type === "tiktok") frame = `<div class="tt"><iframe src="https://www.tiktok.com/embed/v2/${p.id}" loading="lazy" allowfullscreen title="${esc(p.title)}"></iframe></div>`;
    else if (p.type === "twitch-clip") frame = `<div class="ratio"><iframe src="https://clips.twitch.tv/embed?clip=${p.id}&parent=${par}" loading="lazy" allowfullscreen title="${esc(p.title)}"></iframe></div>`;
    return frame ? `<div class="vid">${frame}<p>${esc(p.title)}</p></div>` : "";
  }).join("");
  if (vids) $("vids").innerHTML = vids; else $("vidBlock").remove();

  // YouTube: every long-form upload in one playlist player (Shorts are left out)
  const yt = SITE.youtubeChannelId || "";
  if (/^UC[\w-]{22}$/.test(yt)) {
    $("ytFrame").innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/videoseries?list=UULF${yt.slice(2)}&autoplay=1&mute=1&loop=1&playsinline=1&enablejsapi=1&origin=${encodeURIComponent(location.origin)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Dizzyits YouTube videos"></iframe>`;
    if (SITE.links.youtube) $("ytLink").href = SITE.links.youtube.replace(/\/?$/, "/videos");
  } else $("ytBlock").remove();

</script>
